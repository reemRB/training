<input type="text" [formControl]="search" placeholder="searchTitle" />
@if (isLoading()) {
  <p>loading meals...</p>
} @else {
  @if (error()) {
    <p>Error loading the meals</p>
  } @else {
    @if (meals().length === 0) {
      <p>No results found</p>
    } @else {
      @for (meal of meals(); track meal.id) {
        <img [src]="meal.thumbnail" alt="food thumbnail" class="w-2 h-2 object-cover rounded-3xl" />
        <p>{{ meal.title }}</p>
      }
    }
  }
}
